<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa aktywności — SKK Morzkulc</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
  <style>
    :root {
      --bg: #0d1117;
      --panel-bg: rgba(13,17,23,0.85);
      --panel-border: #333;
      --text: #888;
      --text-dim: #555;
      --input-bg: #1e1e2e;
      --input-color: #e0e0e0;
      --input-border: #444;
      --status-color: #666;
    }
    body.light {
      --bg: #f0f0eb;
      --panel-bg: rgba(240,240,235,0.92);
      --panel-border: #bbb;
      --text: #555;
      --text-dim: #aaa;
      --input-bg: #fff;
      --input-color: #222;
      --input-border: #bbb;
      --status-color: #999;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; transition: background 0.2s; }
    #map { width: 100%; height: 100%; }

    #yearBar {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 5px 12px;
      backdrop-filter: blur(6px);
    }
    #yearBar label { font: 12px system-ui, sans-serif; color: var(--text); }
    #yearFilter {
      background: var(--input-bg);
      color: var(--input-color);
      border: 1px solid var(--input-border);
      border-radius: 5px;
      padding: 3px 8px;
      font: 12px system-ui, sans-serif;
    }

    #themeToggle {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    #legend {
      position: fixed;
      bottom: 32px;
      left: 10px;
      z-index: 1000;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 8px 12px;
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font: 11px system-ui, sans-serif;
      color: var(--text);
    }
    .legend-dot {
      border-radius: 50%;
      opacity: 0.75;
      flex-shrink: 0;
    }

    #status {
      position: fixed;
      bottom: 8px;
      right: 10px;
      font: 11px/1.4 system-ui, sans-serif;
      color: var(--status-color);
      pointer-events: none;
      z-index: 1000;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font: 14px system-ui, sans-serif;
      z-index: 2000;
      flex-direction: column;
      gap: 12px;
      text-align: center;
      padding: 24px;
    }
    #overlay.hidden { display: none; }

    /* Kolor celowo NIEZALEŻNY od --panel-bg/motywu — ma się wyróżniać na tle
       mapy niezależnie od tego, czy akurat jest jasna czy ciemna (przycisk
       widoczny tylko w trybie standalone PWA, czyli praktycznie tylko na
       telefonie — na desktopie mapa i tak otwiera się w nowej karcie). */
    #mapBackBtn {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1100;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 10px 22px;
      font: 600 14px system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.45);
    }
    #mapBackBtn:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div id="overlay">Ładowanie mapy…</div>
  <button id="mapBackBtn" type="button">← Wróć do aplikacji</button>
  <script>
    (function() {
      const isStandalone = window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;
      if (isStandalone) {
        const btn = document.getElementById("mapBackBtn");
        if (btn) {
          btn.style.display = "block";
          btn.addEventListener("click", () => history.back());
        }
      }
    })();
  </script>
  <div id="yearBar">
    <label for="yearFilter">Rok:</label>
    <select id="yearFilter"><option value="">Wszystkie lata</option></select>
  </div>
  <button id="themeToggle" title="Przełącz motyw">☀️</button>
  <div id="map"></div>
  <div id="legend">
    <div class="legend-row">
      <div class="legend-dot" style="width:10px;height:10px;background:#00bcd4;"></div>
      <span>mało spływów</span>
    </div>
    <div class="legend-row">
      <div class="legend-dot" style="width:22px;height:22px;background:#00bcd4;"></div>
      <span>dużo spływów</span>
    </div>
    <div class="legend-row" style="color:var(--text-dim);margin-top:2px;">
      Kliknij kółko, by sprawdzić
    </div>
  </div>
  <div id="status"></div>

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script>
    // OpenFreeMap: hostowane w Europie, darmowe bez limitu, bez klucza API —
    // zamiennik CARTO (basemaps.cartocdn.com), który stopniowo wygasza darmowy
    // dostęp anonimowy na rzecz płatnego API z kluczem.
    const STYLE_DARK  = "https://tiles.openfreemap.org/styles/dark";
    const STYLE_LIGHT = "https://tiles.openfreemap.org/styles/positron";
    const MARKER_DARK  = "#00bcd4";
    const MARKER_LIGHT = "#0077cc";
    const SOURCE_ID = "locations";
    const LAYER_ID  = "locations-circles";

    // Ciemna wersja mapy (styl OpenFreeMap "dark") jest na małym ekranie
    // słabo czytelna (niski kontrast etykiet/dróg na telefonie) — domyślnie
    // jasny tryb na komórce, ciemny zostaje domyślny na desktopie. Ten sam
    // próg 720px co reszta aplikacji (base.css, mobile nav).
    const isMobile = window.matchMedia("(max-width: 720px)").matches;
    let darkMode   = !isMobile;
    let map        = null;
    let allLocations = [];
    let renderedLocations = [];

    const overlayEl     = document.getElementById("overlay");
    const yearSel       = document.getElementById("yearFilter");
    const statusEl      = document.getElementById("status");
    const themeBtn      = document.getElementById("themeToggle");
    const legendDots    = document.querySelectorAll(".legend-dot");

    // Zsynchronizuj UI (klasa body, ikonka, kropki legendy) z powyższym
    // domyślnym trybem PRZED pierwszym renderem mapy — inaczej telefon
    // startowałby wizualnie w trybie jasnym, ale z ikonką/legendą ciemnego.
    // (updateLegendDots/markerColor są zdefiniowane niżej jako function
    // declarations — hoisted, więc dostępne już tutaj.)
    document.body.classList.toggle("light", !darkMode);
    themeBtn.textContent = darkMode ? "☀️" : "🌙";
    updateLegendDots();

    function markerColor() { return darkMode ? MARKER_DARK : MARKER_LIGHT; }

    function updateLegendDots() {
      legendDots.forEach(d => { d.style.background = markerColor(); });
    }

    function esc(s) {
      return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function buildPopup(loc) {
      const cnt = loc.logCount;
      const word = cnt === 1 ? "wpis" : cnt < 5 ? "wpisy" : "wpisów";
      const users = loc.topUsers || [];
      const usersHtml = users.length
        ? `<br><span style="color:#aaa;font-size:0.85em">Ostatnio: ${users.map(u => esc(u.name)).join(", ")}</span>`
        : "";
      return `<strong>${esc(loc.placeName)}</strong><br>${cnt} ${word}${usersHtml}`;
    }

    function currentlyVisible() {
      const yr = parseInt(yearSel.value, 10);
      return isNaN(yr)
        ? allLocations
        : allLocations.filter(l => Array.isArray(l.yearsActive) && l.yearsActive.includes(yr));
    }

    // Style OpenFreeMap nie noszą naszej warstwy punktów — setStyle() ją czyści,
    // więc trzeba ją doczepić ponownie po każdym przełączeniu jasny/ciemny.
    function ensureLocationsLayer() {
      if (map.getSource(SOURCE_ID)) return;
      map.addSource(SOURCE_ID, { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      map.addLayer({
        id: LAYER_ID,
        type: "circle",
        source: SOURCE_ID,
        paint: {
          "circle-radius": ["get", "radius"],
          "circle-color": markerColor(),
          "circle-opacity": 0.65,
          "circle-stroke-width": 1.5,
          "circle-stroke-color": markerColor(),
        },
      });
      map.on("click", LAYER_ID, (e) => {
        const f = e.features && e.features[0];
        const loc = f && renderedLocations[f.properties.idx];
        if (!loc) return;
        new maplibregl.Popup({ closeButton: true }).setLngLat(e.lngLat).setHTML(buildPopup(loc)).addTo(map);
      });
      map.on("mouseenter", LAYER_ID, () => { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", LAYER_ID, () => { map.getCanvas().style.cursor = ""; });
    }

    function renderMarkers(locations) {
      if (!map) return;
      renderedLocations = locations;
      const features = locations.map((loc, idx) => ({
        type: "Feature",
        properties: { idx, radius: Math.min(6 + Math.log2(loc.logCount + 1) * 3, 22) },
        geometry: { type: "Point", coordinates: [loc.lng, loc.lat] },
      }));
      const source = map.getSource(SOURCE_ID);
      if (source) source.setData({ type: "FeatureCollection", features });

      if (locations.length) {
        const bounds = new maplibregl.LngLatBounds();
        for (const loc of locations) bounds.extend([loc.lng, loc.lat]);
        map.fitBounds(bounds, { padding: 60, maxZoom: 14, duration: 0 });
      }
    }

    yearSel.addEventListener("change", () => renderMarkers(currentlyVisible()));

    themeBtn.addEventListener("click", () => {
      darkMode = !darkMode;
      document.body.classList.toggle("light", !darkMode);
      themeBtn.textContent = darkMode ? "☀️" : "🌙";
      updateLegendDots();

      if (map) {
        map.once("style.load", () => {
          ensureLocationsLayer();
          renderMarkers(currentlyVisible());
          // Bez tego canvas potrafi zostać na starej klatce (stary styl) mimo
          // że dane stylu w MapLibre są już poprawne — resize() wymusza pełne
          // przerysowanie zamiast czekać na najbliższą interakcję (pan/zoom).
          map.resize();
        });
        map.setStyle(darkMode ? STYLE_DARK : STYLE_LIGHT);
      }
    });

    async function initMap() {
      try {
        const resp = await fetch("/api/km/map-data");
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const data = await resp.json();

        overlayEl.classList.add("hidden");

        allLocations = data?.locations || [];
        const years  = data?.years || [];

        if (allLocations.length === 0) {
          document.getElementById("map").innerHTML =
            "<div style='display:flex;align-items:center;justify-content:center;height:100%;color:#aaa;font:14px system-ui,sans-serif;padding:24px;text-align:center;'>Brak danych lokalizacji.<br>Mapa aktualizuje się po uruchomieniu zadania z menu w arkuszu.</div>";
          return;
        }

        for (const yr of years) {
          const opt = document.createElement("option");
          opt.value = String(yr);
          opt.textContent = String(yr);
          yearSel.appendChild(opt);
        }

        map = new maplibregl.Map({
          container: "map",
          style: darkMode ? STYLE_DARK : STYLE_LIGHT,
          center: [19.0, 52.0],
          zoom: 5.5,
        });
        map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-left");
        map.on("load", () => {
          ensureLocationsLayer();
          renderMarkers(allLocations);
        });

        if (data.updatedAt) {
          const d = new Date(data.updatedAt);
          statusEl.textContent = "Aktualizacja: " + d.toLocaleDateString("pl-PL") + " " + d.toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" });
        }
      } catch (err) {
        overlayEl.textContent = "Błąd ładowania mapy: " + (err?.message || String(err));
      }
    }

    initMap();
  </script>
</body>
</html>
